<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stage Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #000; color: #e5e5e5;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none; touch-action: manipulation;
    }
    body.armed { cursor: none !important; }
    .video-deck {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; background: #000;
      opacity: 0; z-index: 1;
      pointer-events: none; will-change: opacity;
    }
    #blackout {
      position: fixed; inset: 0;
      background: #000; opacity: 1; z-index: 10;
      pointer-events: none; will-change: opacity;
      transition: opacity 1200ms ease-in-out;
    }
    #setupOverlay {
      position: fixed; inset: 0; z-index: 30;
      background: radial-gradient(circle at center, #17120e 0%, #050505 75%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      padding: 32px; text-align: center;
    }
    #setupOverlay.hidden { display: none !important; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.04em; color: #f59e0b; }
    .progress-wrap {
      width: min(460px, 85vw); height: 10px;
      background: #262626; border-radius: 999px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: #f59e0b; transition: width 180ms linear;
    }
    #statusText { font-size: 15px; color: #a3a3a3; }
    #armBtn {
      padding: 18px 40px; font-size: 18px; font-weight: 700;
      border-radius: 12px; border: 2px solid #f59e0b;
      background: #f59e0b; color: #000; cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #armBtn:active { transform: scale(0.97); }
  </style>
</head>
<body oncontextmenu="return false;">
  <video id="deck0" class="video-deck" muted loop playsinline webkit-playsinline preload="auto"></video>
  <video id="deck1" class="video-deck" muted loop playsinline webkit-playsinline preload="auto"></video>
  <div id="blackout"></div>
  <audio id="ambient" loop preload="auto"></audio>

  <div id="setupOverlay">
    <h1 id="showTitle">Connecting to Stage Server...</h1>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="statusText">Waiting for manifest...</div>
    <button id="armBtn" type="button">TAP ONCE TO ARM STAGE (FULLSCREEN)</button>
  </div>

  <script>
    const decks = [document.getElementById('deck0'), document.getElementById('deck1')];
    const blackoutEl = document.getElementById('blackout');
    const ambientEl = document.getElementById('ambient');
    const setupOverlay = document.getElementById('setupOverlay');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const showTitle = document.getElementById('showTitle');
    const armBtn = document.getElementById('armBtn');

    let manifest = null;
    let mediaUrls = {};
    let ambientUrl = null;
    let ws = null;
    let wakeLock = null;
    let audioCtx = null;

    let isArmed = false;
    let preloadPercent = 0;
    let preloadStatus = 'loading';
    let boardWarning = null;

    let activeDeck = 0;
    let renderedScene = -1;
    let renderedBlackout = true;
    let transitionToken = 0;
    let latestState = null;
    let targetAudioVol = 0;
    let currentAudioVol = 0;

    // Loop safeguard if Smartboard WebView fires ended despite loop attribute
    decks.forEach((v) => {
      v.addEventListener('ended', () => {
        v.currentTime = 0;
        v.play().catch(() => {});
      });
    });

    // Smooth ambient volume interpolator (60fps)
    setInterval(() => {
      if (!ambientUrl) return;
      const diff = targetAudioVol - currentAudioVol;
      if (Math.abs(diff) < 0.005) {
        currentAudioVol = targetAudioVol;
      } else {
        currentAudioVol += diff * 0.08;
      }
      ambientEl.volume = Math.max(0, Math.min(1, currentAudioVol));
    }, 30);

    // Watchdog: keep active deck playing if Smartboard tries to pause it
    setInterval(() => {
      if (!renderedBlackout && renderedScene >= 0) {
        const v = decks[activeDeck];
        if (v.paused && v.readyState >= 2) v.play().catch(() => {});
      }
    }, 1200);

    function sendBoardStatus() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'board_status',
          armed: isArmed,
          preloadPercent,
          preloadStatus,
          warning: boardWarning
        }));
      }
    }

    function fetchBlobWithProgress(url, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'blob';
        xhr.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
            resolve(URL.createObjectURL(xhr.response));
          } else {
            reject(new Error(`HTTP ${xhr.status}`));
          }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send();
      });
    }

    async function preloadAllMedia() {
      while (!manifest) {
        try {
          const res = await fetch('/api/config', { cache: 'no-store' });
          manifest = await res.json();
        } catch {
          await new Promise((r) => setTimeout(r, 1500));
        }
      }

      showTitle.textContent = manifest.title || 'Stage Display';
      const items = [];
      for (const s of manifest.scenes) {
        if (s.exists) {
          items.push({ key: `scene_${s.index}`, url: `/media/${encodeURIComponent(s.file)}`, size: s.size, label: s.title });
        } else {
          boardWarning = `Missing file: ${s.file}`;
        }
      }
      if (manifest.ambient && manifest.ambient.exists) {
        items.push({ key: 'ambient', url: `/media/${encodeURIComponent(manifest.ambient.file)}`, size: manifest.ambient.size, label: 'Ambient Audio' });
      }

      const totalBytes = items.reduce((sum, i) => sum + i.size, 0) || 1;
      let completedBytes = 0;
      let usedFallback = false;
      let lastSent = 0;

      for (const item of items) {
        statusText.textContent = `Preloading into RAM: ${item.label}...`;
        try {
          const blobUrl = await fetchBlobWithProgress(item.url, (loaded) => {
            const pct = Math.min(99, Math.round(((completedBytes + loaded) / totalBytes) * 100));
            if (pct !== preloadPercent) {
              preloadPercent = pct;
              progressBar.style.width = `${pct}%`;
              const now = Date.now();
              if (now - lastSent > 250) {
                lastSent = now;
                sendBoardStatus();
              }
            }
          });
          if (item.key === 'ambient') ambientUrl = blobUrl;
          else mediaUrls[item.key] = blobUrl;
        } catch {
          // Graceful fallback to local HTTP Range streaming if Smartboard RAM is full
          usedFallback = true;
          if (item.key === 'ambient') ambientUrl = item.url;
          else mediaUrls[item.key] = item.url;
        }
        completedBytes += item.size;
      }

      preloadPercent = 100;
      preloadStatus = usedFallback ? 'fallback' : 'ready';
      progressBar.style.width = '100%';
      statusText.textContent = usedFallback
        ? 'Ready (Direct Stream Fallback Active) — Tap Button Below'
        : '100% Cached in RAM — Tap Button Below to Enter Blackout';

      if (ambientUrl) ambientEl.src = ambientUrl;
      if (mediaUrls.scene_0) {
        decks[0].src = mediaUrls.scene_0;
        decks[0].load();
      }
      sendBoardStatus();
      if (latestState) applyState(latestState);
    }

    function waitFrameReady(video, timeoutMs = 380) {
      return new Promise((resolve) => {
        if (video.readyState >= 3) return resolve();
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          video.removeEventListener('canplay', finish);
          video.removeEventListener('loadeddata', finish);
          resolve();
        };
        video.addEventListener('canplay', finish, { once: true });
        video.addEventListener('loadeddata', finish, { once: true });
        setTimeout(finish, timeoutMs);
      });
    }

    async function crossfadeTo(sceneIndex, durationMs) {
      const url = mediaUrls[`scene_${sceneIndex}`];
      if (!url) return;

      const myToken = ++transitionToken;
      const nextIdx = 1 - activeDeck;
      const prevDeck = decks[activeDeck];
      const nextDeck = decks[nextIdx];

      nextDeck.style.transition = 'none';
      nextDeck.style.opacity = '0';
      nextDeck.style.zIndex = '2';
      prevDeck.style.zIndex = '1';
      void nextDeck.offsetWidth;

      if (nextDeck.dataset.loadedKey !== `scene_${sceneIndex}`) {
        nextDeck.src = url;
        nextDeck.dataset.loadedKey = `scene_${sceneIndex}`;
      }
      try { nextDeck.currentTime = 0; } catch {}

      await nextDeck.play().catch(() => {});
      await waitFrameReady(nextDeck);
      if (myToken !== transitionToken) return;

      blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
      blackoutEl.style.opacity = '0';

      nextDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
      nextDeck.style.opacity = '1';

      activeDeck = nextIdx;
      renderedScene = sceneIndex;
      renderedBlackout = false;

      setTimeout(() => {
        if (myToken !== transitionToken) return;
        prevDeck.pause();
        prevDeck.style.transition = 'none';
        prevDeck.style.opacity = '0';
      }, durationMs + 80);
    }

    function applyState(s) {
      latestState = s;
      const dur = s.transitionMs || 1200;

      // Auto-hide setup overlay if show is already live after an accidental Smartboard refresh
      if (!isArmed && !s.blackout && s.activeScene >= 0) {
        setupOverlay.classList.add('hidden');
        document.body.classList.add('armed');
      }

      if (s.blackout) {
        ++transitionToken;
        blackoutEl.style.transition = `opacity ${dur}ms ease-in-out`;
        blackoutEl.style.opacity = '1';
        renderedBlackout = true;
        targetAudioVol = 0;
        if (s.activeScene === -1) renderedScene = -1;
        return;
      }

      if (s.activeScene >= 0) {
        if (s.activeScene !== renderedScene) {
          crossfadeTo(s.activeScene, dur);
        } else if (renderedBlackout) {
          decks[activeDeck].play().catch(() => {});
          blackoutEl.style.transition = `opacity ${dur}ms ease-in-out`;
          blackoutEl.style.opacity = '0';
          renderedBlackout = false;
        }
      }

      if (ambientUrl && isArmed) {
        if (ambientEl.paused) ambientEl.play().catch(() => {});
        targetAudioVol = s.audioPlaying ? (s.audioVolume ?? 0.55) : 0;
      }
    }

    async function requestKeepAwake() {
      try {
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } catch {}

      // Silent Web Audio keepalive holds OS media wake lock & HDMI audio link over plain HTTP
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
        } else if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
      } catch {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isArmed) requestKeepAwake();
    });

    armBtn.addEventListener('click', async () => {
      isArmed = true;
      setupOverlay.classList.add('hidden');
      document.body.classList.add('armed');

      try {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch {}

      await requestKeepAwake();

      // Unlock ambient audio at zero volume so future cues never get blocked by autoplay policies
      if (ambientUrl) {
        ambientEl.volume = 0;
        ambientEl.play().catch(() => {});
      }

      sendBoardStatus();
      if (latestState) applyState(latestState);
    });

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'hello', role: 'stage' }));
        sendBoardStatus();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') applyState(msg.state);
        } catch {}
      };

      ws.onclose = () => setTimeout(connectWS, 1000);
      ws.onerror = () => ws.close();
    }

    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 5000);

    connectWS();
    preloadAllMedia();
  </script>
</body>
</html>
