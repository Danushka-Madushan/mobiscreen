<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stage Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #000; color: #e5e5e5;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none; touch-action: manipulation;
    }
    body.armed { cursor: none !important; }
    .video-deck {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; background: #000;
      opacity: 0; z-index: 1;
      pointer-events: none; will-change: opacity;
    }
    #blackout {
      position: fixed; inset: 0;
      background: #000; opacity: 1; z-index: 10;
      pointer-events: none; will-change: opacity;
      transition: opacity 1200ms ease-in-out;
    }
    #setupOverlay {
      position: fixed; inset: 0; z-index: 30;
      background: radial-gradient(circle at center, #17120e 0%, #050505 75%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      padding: 32px; text-align: center;
    }
    #setupOverlay.hidden { display: none !important; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.04em; color: #f59e0b; }
    .progress-wrap {
      width: min(460px, 85vw); height: 10px;
      background: #262626; border-radius: 999px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: #f59e0b; transition: width 180ms linear;
    }
    #statusText { font-size: 15px; color: #a3a3a3; }
    #armBtn {
      padding: 18px 40px; font-size: 18px; font-weight: 700;
      border-radius: 12px; border: 2px solid #f59e0b;
      background: #f59e0b; color: #000; cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    #armBtn:active { transform: scale(0.97); }
  </style>
</head>
<body oncontextmenu="return false;">
  <video id="deck0" class="video-deck" muted playsinline webkit-playsinline preload="auto"></video>
  <video id="deck1" class="video-deck" muted playsinline webkit-playsinline preload="auto"></video>
  <div id="blackout"></div>
  <audio id="ambient" loop preload="auto"></audio>

  <div id="setupOverlay">
    <h1 id="showTitle">Connecting to Stage Server...</h1>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="statusText">Waiting for manifest...</div>
    <button id="armBtn" type="button">TAP ONCE TO ARM STAGE (FULLSCREEN)</button>
  </div>

  <script>
    const decks = [document.getElementById('deck0'), document.getElementById('deck1')];
    const blackoutEl = document.getElementById('blackout');
    const ambientEl = document.getElementById('ambient');
    const setupOverlay = document.getElementById('setupOverlay');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const showTitle = document.getElementById('showTitle');
    const armBtn = document.getElementById('armBtn');

    let manifest = null;
    let mediaUrls = {};
    let ambientUrl = null;
    let ws = null;
    let wakeLock = null;
    let audioCtx = null;

    let isArmed = false;
    let preloadPercent = 0;
    let preloadStatus = 'loading';
    let boardWarning = null;

    let activeDeck = 0;
    let currentRenderKey = null;
    let transitionToken = 0;
    let latestState = null;
    let targetAudioVol = 0;
    let currentAudioVol = 0;

    // Loop safeguard: ONLY loop when dataset.isLoop === 'true'
    decks.forEach((v) => {
      v.addEventListener('ended', () => {
        if (v.dataset.isLoop === 'true') {
          v.currentTime = 0;
          v.play().catch(() => {});
        }
      });

      // Stream error recovery guard
      v.addEventListener('error', () => {
        console.warn('[Deck Error] Stream reload for', v.src);
        try {
          const cur = v.currentTime || 0;
          v.load();
          v.currentTime = cur;
          if (v.dataset.isLoop === 'true' && blackoutEl.style.opacity !== '1') {
            v.play().catch(() => {});
          }
        } catch {}
      });
    });

    // Smooth ambient volume interpolator (60fps)
    setInterval(() => {
      if (!ambientUrl) return;
      const diff = targetAudioVol - currentAudioVol;
      if (Math.abs(diff) < 0.005) {
        currentAudioVol = targetAudioVol;
      } else {
        currentAudioVol += diff * 0.08;
      }
      ambientEl.volume = Math.max(0, Math.min(1, currentAudioVol));
      if (currentAudioVol === 0 && targetAudioVol === 0 && !ambientEl.paused) {
        try { ambientEl.pause(); } catch {}
      }
    }, 30);

    // Watchdog: keep active loop deck playing if browser WebView tries to pause it
    setInterval(() => {
      if (isArmed && blackoutEl.style.opacity !== '1') {
        const v = decks[activeDeck];
        if (v && v.dataset.isLoop === 'true' && v.paused && v.readyState >= 2) {
          v.play().catch(() => {});
        }
      }
    }, 1200);

    function sendBoardStatus() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'board_status',
          armed: isArmed,
          preloadPercent,
          preloadStatus,
          warning: boardWarning
        }));
      }
    }

    async function initStreamingMedia() {
      while (!manifest) {
        try {
          const res = await fetch('/api/config', { cache: 'no-store' });
          manifest = await res.json();
        } catch {
          await new Promise((r) => setTimeout(r, 1000));
        }
      }

      showTitle.textContent = manifest.title || 'Stage Display';

      // Map HTTP 206 Range streaming endpoints directly
      // Total Smartboard RAM usage: ~15MB across both decks (Zero crash risk)
      if (manifest.extras) {
        for (const [k, v] of Object.entries(manifest.extras)) {
          if (v && v.exists) {
            const url = `/media/${encodeURIComponent(v.file)}`;
            mediaUrls[`extra_${k}`] = url;
            mediaUrls[v.file] = url;
          } else if (v) {
            boardWarning = `Missing extra: ${v.file}`;
          }
        }
      }

      for (const s of manifest.scenes) {
        if (s.exists) {
          const sUrl = `/media/${encodeURIComponent(s.file)}`;
          mediaUrls[`scene_${s.index}`] = sUrl;
          mediaUrls[s.file] = sUrl;
        } else {
          boardWarning = `Missing scene: ${s.file}`;
        }

        if (s.transition) {
          if (s.transition.exists) {
            const tUrl = `/media/${encodeURIComponent(s.transition.file)}`;
            mediaUrls[`trans_${s.index}`] = tUrl;
            mediaUrls[s.transition.file] = tUrl;
          } else {
            boardWarning = `Missing transition: ${s.transition.file}`;
          }
        }
      }

      if (manifest.ambient && manifest.ambient.exists) {
        ambientUrl = `/media/${encodeURIComponent(manifest.ambient.file)}`;
        ambientEl.src = ambientUrl;
      }

      preloadPercent = 100;
      preloadStatus = 'ready';
      progressBar.style.width = '100%';
      statusText.textContent = 'System Ready — Tap Button Below to Arm Stage';

      // Prime deck 0 with loop.mp4
      const standbyUrl = mediaUrls['extra_loop'];
      if (standbyUrl) {
        decks[0].src = standbyUrl;
        decks[0].loop = true;
        decks[0].dataset.isLoop = 'true';
        decks[0].dataset.loadedKey = 'extra_loop';
        decks[0].load();
      }

      sendBoardStatus();
      if (latestState) applyState(latestState);
    }

    function waitFrameReady(video, timeoutMs = 450) {
      return new Promise((resolve) => {
        if (video.readyState >= 2) return resolve();
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          video.removeEventListener('canplay', finish);
          video.removeEventListener('loadeddata', finish);
          video.removeEventListener('error', finish);
          resolve();
        };
        video.addEventListener('canplay', finish, { once: true });
        video.addEventListener('loadeddata', finish, { once: true });
        video.addEventListener('error', finish, { once: true });
        setTimeout(finish, timeoutMs);
      });
    }

    // Crossfade to a looping video (loop.mp4 or scene 01..10)
    async function playLoopVideo(mediaKey, durationMs = 1000) {
      const url = mediaUrls[mediaKey];
      if (!url) return;
      if (currentRenderKey === mediaKey && decks[activeDeck].dataset.loadedKey === mediaKey && !decks[activeDeck].paused) {
        // Already playing this loop
        blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
        blackoutEl.style.opacity = '0';
        return;
      }

      const myToken = ++transitionToken;
      const nextIdx = 1 - activeDeck;
      const prevDeck = decks[activeDeck];
      const nextDeck = decks[nextIdx];

      nextDeck.style.transition = 'none';
      nextDeck.style.opacity = '0';
      nextDeck.style.zIndex = '2';
      prevDeck.style.zIndex = '1';
      void nextDeck.offsetWidth;

      nextDeck.loop = true;
      nextDeck.dataset.isLoop = 'true';
      if (nextDeck.dataset.loadedKey !== mediaKey) {
        nextDeck.src = url;
        nextDeck.dataset.loadedKey = mediaKey;
      }
      try { nextDeck.currentTime = 0; } catch {}

      await nextDeck.play().catch(() => {});
      await waitFrameReady(nextDeck);
      if (myToken !== transitionToken) return;

      blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
      blackoutEl.style.opacity = '0';

      nextDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
      nextDeck.style.opacity = '1';

      activeDeck = nextIdx;
      currentRenderKey = mediaKey;

      setTimeout(() => {
        if (myToken !== transitionToken) return;
        prevDeck.pause();
        prevDeck.style.transition = 'none';
        prevDeck.style.opacity = '0';
      }, durationMs + 80);
    }

    // Play transition clip ONCE, then automatically transition to destination loop
    async function playTransitionThenLoop(transKey, destKey, targetIndex, durationMs = 800) {
      const transUrl = mediaUrls[transKey];
      const destUrl = mediaUrls[destKey];
      if (!transUrl || !destUrl) {
        return playLoopVideo(destKey, durationMs);
      }

      const myToken = ++transitionToken;
      const nextIdx = 1 - activeDeck;
      const prevDeck = decks[activeDeck];
      const transDeck = decks[nextIdx];

      transDeck.style.transition = 'none';
      transDeck.style.opacity = '0';
      transDeck.style.zIndex = '2';
      prevDeck.style.zIndex = '1';
      void transDeck.offsetWidth;

      transDeck.loop = false;
      transDeck.dataset.isLoop = 'false';
      transDeck.src = transUrl;
      transDeck.dataset.loadedKey = transKey;
      try { transDeck.currentTime = 0; } catch {}

      await transDeck.play().catch(() => {});
      await waitFrameReady(transDeck);
      if (myToken !== transitionToken) return;

      blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
      blackoutEl.style.opacity = '0';

      transDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
      transDeck.style.opacity = '1';

      activeDeck = nextIdx;
      currentRenderKey = transKey;

      // Pause old deck and pre-load destination loop into it
      setTimeout(() => {
        if (myToken !== transitionToken) return;
        prevDeck.pause();
        prevDeck.style.transition = 'none';
        prevDeck.style.opacity = '0';
        prevDeck.loop = true;
        prevDeck.dataset.isLoop = 'true';
        prevDeck.src = destUrl;
        prevDeck.dataset.loadedKey = destKey;
        try { prevDeck.currentTime = 0; } catch {}
        prevDeck.load();
      }, durationMs + 60);

      // Listen for near end of transition clip to execute seamless lookahead crossfade
      let handedOff = false;
      const cleanupListeners = () => {
        transDeck.removeEventListener('timeupdate', onTimeUpdate);
        transDeck.removeEventListener('ended', triggerHandoff);
      };

      const triggerHandoff = async () => {
        cleanupListeners();
        if (handedOff || myToken !== transitionToken) return;
        handedOff = true;

        const destDeck = prevDeck;
        destDeck.style.zIndex = '3';
        transDeck.style.zIndex = '2';
        try { destDeck.currentTime = 0; } catch {}
        await destDeck.play().catch(() => {});
        await waitFrameReady(destDeck);
        if (myToken !== transitionToken) return;

        destDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
        destDeck.style.opacity = '1';
        transDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
        transDeck.style.opacity = '0';

        activeDeck = decks.indexOf(destDeck);
        currentRenderKey = destKey;

        setTimeout(() => {
          if (myToken !== transitionToken) return;
          transDeck.pause();
          transDeck.style.transition = 'none';
          transDeck.style.opacity = '0';
        }, durationMs + 80);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'scene_transition_done', index: targetIndex }));
        }
      };

      const onTimeUpdate = () => {
        if (myToken !== transitionToken) {
          cleanupListeners();
          return;
        }
        const dur = transDeck.duration;
        if (Number.isFinite(dur) && dur > 0.5 && transDeck.currentTime >= Math.max(0.2, dur - 0.75)) {
          triggerHandoff();
        }
      };

      transDeck.addEventListener('timeupdate', onTimeUpdate);
      transDeck.addEventListener('ended', triggerHandoff, { once: true });

      // Hardware decoder watchdog fallback
      setTimeout(() => {
        if (!handedOff && myToken === transitionToken) {
          triggerHandoff();
        }
      }, 7000);
    }

    // Play fade_out.mp4 ONCE from Standby Loop, then transition to pure Blackout
    async function playFadeOutToBlack(durationMs = 800) {
      const url = mediaUrls['extra_fadeOut'];
      if (!url) {
        blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
        blackoutEl.style.opacity = '1';
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'fade_out_done' }));
        return;
      }

      const myToken = ++transitionToken;
      const nextIdx = 1 - activeDeck;
      const prevDeck = decks[activeDeck];
      const fadeDeck = decks[nextIdx];

      fadeDeck.style.transition = 'none';
      fadeDeck.style.opacity = '0';
      fadeDeck.style.zIndex = '2';
      prevDeck.style.zIndex = '1';
      void fadeDeck.offsetWidth;

      fadeDeck.loop = false;
      fadeDeck.dataset.isLoop = 'false';
      fadeDeck.src = url;
      fadeDeck.dataset.loadedKey = 'extra_fadeOut';
      try { fadeDeck.currentTime = 0; } catch {}

      await fadeDeck.play().catch(() => {});
      await waitFrameReady(fadeDeck);
      if (myToken !== transitionToken) return;

      fadeDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
      fadeDeck.style.opacity = '1';
      activeDeck = nextIdx;
      currentRenderKey = 'extra_fadeOut';

      setTimeout(() => {
        if (myToken !== transitionToken) return;
        prevDeck.pause();
        prevDeck.style.transition = 'none';
        prevDeck.style.opacity = '0';
      }, durationMs + 60);

      let finished = false;
      const cleanupListeners = () => {
        fadeDeck.removeEventListener('timeupdate', checkEnd);
        fadeDeck.removeEventListener('ended', completeFadeOut);
      };

      const completeFadeOut = () => {
        cleanupListeners();
        if (finished || myToken !== transitionToken) return;
        finished = true;

        blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
        blackoutEl.style.opacity = '1';

        setTimeout(() => {
          if (myToken !== transitionToken) return;
          fadeDeck.pause();
          fadeDeck.style.transition = 'none';
          fadeDeck.style.opacity = '0';
          currentRenderKey = 'blackout';
        }, durationMs + 80);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'fade_out_done' }));
        }
      };

      const checkEnd = () => {
        if (myToken !== transitionToken) {
          cleanupListeners();
          return;
        }
        const dur = fadeDeck.duration;
        if (Number.isFinite(dur) && dur > 0.5 && fadeDeck.currentTime >= Math.max(0.2, dur - 0.7)) {
          completeFadeOut();
        }
      };

      fadeDeck.addEventListener('timeupdate', checkEnd);
      fadeDeck.addEventListener('ended', completeFadeOut, { once: true });

      // Hardware decoder watchdog fallback
      setTimeout(() => {
        if (!finished && myToken === transitionToken) {
          completeFadeOut();
        }
      }, 7000);
    }

    // Play fade_in.mp4 ONCE from Blackout, then smoothly transition into loop.mp4 (looping)
    async function playFadeInHome(durationMs = 800) {
      const inUrl = mediaUrls['extra_fadeIn'];
      const loopUrl = mediaUrls['extra_loop'];
      if (!inUrl || !loopUrl) {
        return playLoopVideo('extra_loop', durationMs);
      }

      const myToken = ++transitionToken;
      const nextIdx = 1 - activeDeck;
      const prevDeck = decks[activeDeck];
      const inDeck = decks[nextIdx];

      inDeck.style.transition = 'none';
      inDeck.style.opacity = '1';
      inDeck.style.zIndex = '2';
      prevDeck.style.zIndex = '1';
      void inDeck.offsetWidth;

      inDeck.loop = false;
      inDeck.dataset.isLoop = 'false';
      inDeck.src = inUrl;
      inDeck.dataset.loadedKey = 'extra_fadeIn';
      try { inDeck.currentTime = 0; } catch {}

      await inDeck.play().catch(() => {});
      await waitFrameReady(inDeck);
      if (myToken !== transitionToken) return;

      // Lift blackout
      blackoutEl.style.transition = `opacity ${durationMs}ms ease-in-out`;
      blackoutEl.style.opacity = '0';

      activeDeck = nextIdx;
      currentRenderKey = 'extra_fadeIn';

      // Preload loop.mp4 on the other deck
      prevDeck.pause();
      prevDeck.style.transition = 'none';
      prevDeck.style.opacity = '0';
      prevDeck.loop = true;
      prevDeck.dataset.isLoop = 'true';
      prevDeck.src = loopUrl;
      prevDeck.dataset.loadedKey = 'extra_loop';
      try { prevDeck.currentTime = 0; } catch {}
      prevDeck.load();

      let handedOff = false;
      const cleanupListeners = () => {
        inDeck.removeEventListener('timeupdate', checkInEnd);
        inDeck.removeEventListener('ended', triggerHomeLoop);
      };

      const triggerHomeLoop = async () => {
        cleanupListeners();
        if (handedOff || myToken !== transitionToken) return;
        handedOff = true;

        const destDeck = prevDeck;
        destDeck.style.zIndex = '3';
        inDeck.style.zIndex = '2';
        try { destDeck.currentTime = 0; } catch {}
        await destDeck.play().catch(() => {});
        await waitFrameReady(destDeck);
        if (myToken !== transitionToken) return;

        destDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
        destDeck.style.opacity = '1';
        inDeck.style.transition = `opacity ${durationMs}ms ease-in-out`;
        inDeck.style.opacity = '0';

        activeDeck = decks.indexOf(destDeck);
        currentRenderKey = 'extra_loop';

        setTimeout(() => {
          if (myToken !== transitionToken) return;
          inDeck.pause();
          inDeck.style.transition = 'none';
          inDeck.style.opacity = '0';
        }, durationMs + 80);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'fade_in_done' }));
        }
      };

      const checkInEnd = () => {
        if (myToken !== transitionToken) {
          cleanupListeners();
          return;
        }
        const dur = inDeck.duration;
        if (Number.isFinite(dur) && dur > 0.5 && inDeck.currentTime >= Math.max(0.2, dur - 0.75)) {
          triggerHomeLoop();
        }
      };

      inDeck.addEventListener('timeupdate', checkInEnd);
      inDeck.addEventListener('ended', triggerHomeLoop, { once: true });

      // Hardware decoder watchdog fallback
      setTimeout(() => {
        if (!handedOff && myToken === transitionToken) {
          triggerHomeLoop();
        }
      }, 7000);
    }

    function applyState(s) {
      latestState = s;
      const dur = s.transitionMs || 1000;

      // Auto-hide setup overlay if state is live
      if (!isArmed) {
        if (s.boardArmed) {
          setupOverlay.classList.add('hidden');
          document.body.classList.add('armed');
          isArmed = true;
        } else {
          return; // Never attempt autoplay before armBtn is clicked
        }
      }

      const mode = s.stageMode || (s.blackout ? 'blackout' : s.activeScene >= 0 ? 'scene' : 'standby_loop');

      if (mode === 'standby_loop') {
        targetAudioVol = 0;
        playLoopVideo('extra_loop', dur);
        return;
      }

      if (mode === 'transitioning_black') {
        targetAudioVol = 0;
        playFadeOutToBlack(dur);
        return;
      }

      if (mode === 'blackout' || s.blackout) {
        ++transitionToken;
        blackoutEl.style.transition = `opacity ${dur}ms ease-in-out`;
        blackoutEl.style.opacity = '1';
        targetAudioVol = 0;
        currentRenderKey = 'blackout';
        decks.forEach((d) => {
          setTimeout(() => { if (blackoutEl.style.opacity === '1') d.pause(); }, dur + 50);
        });
        return;
      }

      if (mode === 'transitioning_home') {
        targetAudioVol = 0;
        playFadeInHome(dur);
        return;
      }

      if (mode === 'scene_transition') {
        const transIdx = s.targetScene - 1;
        playTransitionThenLoop(`trans_${transIdx}`, `scene_${s.targetScene}`, s.targetScene, dur);
        if (ambientUrl && isArmed) {
          if (ambientEl.paused) ambientEl.play().catch(() => {});
          targetAudioVol = s.audioPlaying ? (s.audioVolume ?? 0.2) : 0;
        }
        return;
      }

      if (mode === 'scene' && s.activeScene >= 0) {
        playLoopVideo(`scene_${s.activeScene}`, dur);
        if (ambientUrl && isArmed) {
          if (ambientEl.paused) ambientEl.play().catch(() => {});
          targetAudioVol = s.audioPlaying ? (s.audioVolume ?? 0.2) : 0;
        }
      }
    }

    async function requestKeepAwake() {
      try {
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } catch {}

      // Silent Web Audio keepalive holds OS media wake lock & HDMI audio link over plain HTTP
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
        } else if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
      } catch {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isArmed) requestKeepAwake();
    });

    armBtn.addEventListener('click', async () => {
      isArmed = true;
      setupOverlay.classList.add('hidden');
      document.body.classList.add('armed');

      try {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch {}

      await requestKeepAwake();

      if (ambientUrl) {
        ambientEl.volume = 0;
        ambientEl.play().catch(() => {});
      }

      sendBoardStatus();

      // Immediately begin playing standby loop.mp4!
      if (!latestState || latestState.stageMode === 'standby_loop') {
        playLoopVideo('extra_loop', 800);
      } else {
        applyState(latestState);
      }
    });

    let reconnectTimer = null;
    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectWS();
      }, 1000);
    }

    function connectWS() {
      if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.close(); } catch {}
      }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'hello', role: 'stage' }));
        sendBoardStatus();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') applyState(msg.state);
        } catch {}
      };

      ws.onclose = () => scheduleReconnect();
      ws.onerror = () => {
        try { ws.close(); } catch {}
        scheduleReconnect();
      };
    }

    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 5000);

    connectWS();
    initStreamingMedia();
  </script>
</body>
</html>
