<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stage Teleprompter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000; color: #e7e5e4;
      font-family: system-ui, -apple-system, sans-serif;
      padding-top: 86px; padding-bottom: 94px;
      overscroll-behavior: none;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      background: rgba(10, 10, 10, 0.96);
      border-bottom: 1px solid #292524;
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 4px 8px;
      border-radius: 6px; background: #292524; color: #a8a29e;
    }
    .badge.ok { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .badge.warn { background: #451a03; color: #fbbf24; border: 1px solid #92400e; }
    .badge.err { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
    .audio-out-btn {
      cursor: pointer; border: 1px solid #44403c; background: #1c1917;
      font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 700;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .audio-out-btn.phone {
      color: #fbbf24; border-color: #b45309; background: #261605;
    }
    .audio-out-btn.screen {
      color: #38bdf8; border-color: #0284c7; background: #082f49;
    }
    #timerBtn {
      font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700;
      padding: 4px 10px; border-radius: 6px; border: 1px solid #44403c;
      background: #1c1917; color: #f5f5f4; cursor: pointer;
    }
    #timerBtn.warn { color: #fbbf24; border-color: #b45309; }
    #timerBtn.over { color: #f87171; border-color: #dc2626; }
    .sub-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: #a8a29e;
    }
    .font-controls button {
      background: #1c1917; color: #d6d3d1; border: 1px solid #44403c;
      border-radius: 5px; padding: 2px 9px; font-size: 12px; font-weight: 700; margin-left: 4px;
    }
    main { padding: 14px; display: flex; flex-direction: column; gap: 18px; }
    .intro-card {
      padding: 14px; border-radius: 10px;
      background: #0c0a09; border: 1px dashed #44403c;
      color: #a8a29e; font-size: 15px; line-height: 1.5;
    }
    .scene-card {
      border-radius: 12px; background: #0c0a09;
      border: 2px solid #292524; padding: 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .scene-card.active {
      border-color: #f59e0b; background: #161109;
    }
    .story-card {
      border-radius: 12px; background: #0c0a09;
      border: 2px solid #3b204e; padding: 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .story-card.active {
      border-color: #a855f7; background: #1a0b2e;
    }
    .story-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 8px 12px; border-radius: 8px;
      background: #201130; border: 1px solid #581c87;
      font-size: 13px; font-weight: 700; color: #c084fc;
      letter-spacing: 0.03em;
    }
    .story-card.active .story-header {
      background: #581c87; color: #f3e8ff; border-color: #a855f7;
    }
    .story-note {
      font-size: 13px; color: #a8a29e; font-style: italic;
      margin-bottom: 12px; line-height: 1.4;
    }
    .inline-cue-btn {
      width: 100%; margin: 14px 0; padding: 13px 18px;
      border-radius: 9px; border: 2px solid #0284c7;
      background: #0369a1; color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .inline-cue-btn:active { transform: scale(0.98); background: #0284c7; }
    .cue-btn {
      width: 100%; padding: 14px 16px; border-radius: 9px;
      border: 1px solid #f59e0b; background: #271a05; color: #fbbf24;
      font-size: 15px; font-weight: 700; text-align: left;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; cursor: pointer;
    }
    .scene-card.active .cue-btn {
      background: #f59e0b; color: #000;
    }
    .script-text {
      color: #f5f5f4; line-height: 1.62;
      white-space: pre-line; font-size: var(--script-size, 20px);
    }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(10, 10, 10, 0.98); border-top: 1px solid #292524;
      padding: 10px 12px; display: grid;
      grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    footer.has-home {
      grid-template-columns: 1fr 1fr 1fr 1.2fr;
    }
    .ctrl-btn {
      padding: 14px 6px; border-radius: 10px; font-size: 12px; font-weight: 700;
      border: 1px solid #44403c; background: #1c1917; color: #e7e5e4; cursor: pointer;
      text-align: center;
    }
    .ctrl-btn.active-blackout { background: #7f1d1d; border-color: #ef4444; color: #fff; }
    .ctrl-btn.active-audio { background: #14532d; border-color: #22c55e; color: #dcfce7; }
    .ctrl-btn.next-btn { background: #f59e0b; border-color: #f59e0b; color: #000; font-size: 13px; }
    .ctrl-btn.home-btn { background: #0369a1; border-color: #0284c7; color: #fff; }
  </style>
</head>
<body>
  <audio id="ambientAudio" loop preload="auto"></audio>
  <header>
    <div class="top-row">
      <span id="boardBadge" class="badge err">SERVER OFFLINE</span>
      <button id="audioOutputBtn" class="badge audio-out-btn phone" type="button" title="Audio Destination: Tap to Toggle">AUDIO: 📱 PHONE</button>
      <button id="timerBtn" type="button" title="Tap to Pause/Resume">00:00</button>
    </div>
    <div class="sub-row">
      <span id="liveStatus">Now Showing: STANDBY LOOP</span>
      <div class="font-controls">
        <button id="resetBtn" type="button">RESET</button>
        <button id="fontDown" type="button">A-</button>
        <button id="fontUp" type="button">A+</button>
      </div>
    </div>
  </header>

  <main id="scriptContainer"></main>

  <footer id="footerBar">
    <button id="blackoutBtn" class="ctrl-btn active-blackout" type="button">SCREEN GO BLACK</button>
    <button id="audioBtn" class="ctrl-btn" type="button">AUDIO MUTED</button>
    <button id="fadeHomeBtn" class="ctrl-btn home-btn" type="button" style="display:none;">FADE HOME IN 🏠</button>
    <button id="nextBtn" class="ctrl-btn next-btn" type="button">START SCENE 1 ▶</button>
  </footer>

  <script>
    const boardBadge = document.getElementById('boardBadge');
    const liveStatus = document.getElementById('liveStatus');
    const scriptContainer = document.getElementById('scriptContainer');
    const footerBar = document.getElementById('footerBar');
    const blackoutBtn = document.getElementById('blackoutBtn');
    const audioBtn = document.getElementById('audioBtn');
    const fadeHomeBtn = document.getElementById('fadeHomeBtn');
    const nextBtn = document.getElementById('nextBtn');
    const timerBtn = document.getElementById('timerBtn');
    const resetBtn = document.getElementById('resetBtn');
    const audioOutputBtn = document.getElementById('audioOutputBtn');
    const ambientEl = document.getElementById('ambientAudio');

    let manifest = null;
    let state = null;
    let ws = null;
    let wakeLock = null;

    let ambientUrl = null;
    let targetAudioVol = 0;
    let currentAudioVol = 0;
    let audioPrimed = false;

    // Smooth ambient volume interpolator (60fps) on phone
    setInterval(() => {
      if (!ambientUrl) return;
      const diff = targetAudioVol - currentAudioVol;
      if (Math.abs(diff) < 0.005) {
        currentAudioVol = targetAudioVol;
      } else {
        currentAudioVol += diff * 0.08;
      }
      ambientEl.volume = Math.max(0, Math.min(1, currentAudioVol));
      if (currentAudioVol === 0 && targetAudioVol === 0 && !ambientEl.paused) {
        try { ambientEl.pause(); } catch {}
      }
    }, 30);

    function primeAudio() {
      if (audioPrimed || !ambientEl) return;
      audioPrimed = true;
      try {
        ambientEl.volume = 0;
        const p = ambientEl.play();
        if (p && p.then) {
          p.then(() => {
            if (targetAudioVol === 0) ambientEl.pause();
          }).catch(() => { audioPrimed = false; });
        }
      } catch { audioPrimed = false; }
    }
    document.addEventListener('click', primeAudio, { passive: true });
    document.addEventListener('touchstart', primeAudio, { passive: true });

    let fontSize = 20;
    try {
      fontSize = Number(localStorage.getItem('stageFontSize')) || 20;
    } catch {}
    document.documentElement.style.setProperty('--script-size', `${fontSize}px`);

    let elapsedSec = 0;
    let timerRunning = false;

    setInterval(() => {
      if (!timerRunning) return;
      elapsedSec += 1;
      renderTimer();
    }, 1000);

    function renderTimer() {
      const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const s = String(elapsedSec % 60).padStart(2, '0');
      timerBtn.textContent = `${m}:${s}`;
      timerBtn.className = elapsedSec >= 480 ? 'over' : elapsedSec >= 360 ? 'warn' : '';
    }

    timerBtn.addEventListener('click', () => {
      timerRunning = !timerRunning;
      vibrate(20);
    });

    function vibrate(ms = 35) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch {}
    }

    async function keepPhoneAwake() {
      try {
        if (navigator.wakeLock && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch {}
    }
    document.addEventListener('click', keepPhoneAwake, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepPhoneAwake();
    });

    document.getElementById('fontUp').addEventListener('click', () => {
      fontSize = Math.min(32, fontSize + 2);
      try { localStorage.setItem('stageFontSize', fontSize); } catch {}
      document.documentElement.style.setProperty('--script-size', `${fontSize}px`);
    });

    document.getElementById('fontDown').addEventListener('click', () => {
      fontSize = Math.max(14, fontSize - 2);
      try { localStorage.setItem('stageFontSize', fontSize); } catch {}
      document.documentElement.style.setProperty('--script-size', `${fontSize}px`);
    });

    function sendCmd(payload) {
      vibrate(35);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    function cueScene(idx) {
      if (elapsedSec === 0 && !timerRunning) timerRunning = true;
      sendCmd({ type: 'cue_scene', index: idx });
    }

    blackoutBtn.addEventListener('click', () => {
      if (!state) return;
      if (state.stageMode === 'standby_loop') {
        sendCmd({ type: 'screen_go_black' });
        const intoCard = document.getElementById('card_into_blackout');
        if (intoCard) intoCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        sendCmd({ type: 'toggle_blackout' });
      }
    });

    fadeHomeBtn.addEventListener('click', () => {
      sendCmd({ type: 'fade_home_in' });
    });

    audioBtn.addEventListener('click', () => sendCmd({ type: 'toggle_audio' }));
    audioOutputBtn.addEventListener('click', () => sendCmd({ type: 'toggle_audio_output' }));

    nextBtn.addEventListener('click', () => {
      if (!manifest || !state) return;

      // Ignore rapid button clicks during transitions
      if (state.stageMode === 'scene_transition' || state.stageMode === 'transitioning_black' || state.stageMode === 'transitioning_home') {
        vibrate(15);
        return;
      }

      // In standby loop: go black
      if (state.stageMode === 'standby_loop') {
        sendCmd({ type: 'screen_go_black' });
        const intoCard = document.getElementById('card_into_blackout');
        if (intoCard) intoCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // In blackout before Scene 1: cue Scene 1 (index 0)
      if (state.activeScene < 0) {
        cueScene(0);
        const card = document.getElementById('card_0');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // If at Scene 10 (last scene) and not in blackout: go black
      if (state.activeScene === manifest.scenes.length - 1 && !state.blackout) {
        sendCmd({ type: 'toggle_blackout' });
        const postCard = document.getElementById('card_post_blackout');
        if (postCard) postCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // If in blackout after Scene 10: fade home in
      if (state.activeScene === manifest.scenes.length - 1 && state.blackout) {
        sendCmd({ type: 'fade_home_in' });
        return;
      }

      // Normal progression to next scene
      const nextIdx = state.activeScene + 1;
      if (nextIdx < manifest.scenes.length) {
        cueScene(nextIdx);
        const card = document.getElementById(`card_${nextIdx}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    resetBtn.addEventListener('click', () => {
      timerRunning = false;
      elapsedSec = 0;
      renderTimer();
      sendCmd({ type: 'reset_show' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    async function loadManifest() {
      const res = await fetch('/api/config', { cache: 'no-store' });
      manifest = await res.json();
      if (manifest.ambient && manifest.ambient.exists) {
        ambientUrl = `/media/${encodeURIComponent(manifest.ambient.file)}`;
        ambientEl.src = ambientUrl;
      }
      scriptContainer.innerHTML = '';

      if (manifest.introNote) {
        const intro = document.createElement('div');
        intro.className = 'intro-card';
        intro.textContent = manifest.introNote;
        scriptContainer.appendChild(intro);
      }

      if (manifest.intoBlackout) {
        const intoData = typeof manifest.intoBlackout === 'object' ? manifest.intoBlackout : { script: manifest.intoBlackout };
        const intoCard = document.createElement('div');
        intoCard.className = 'story-card';
        intoCard.id = 'card_into_blackout';

        const header = document.createElement('div');
        header.className = 'story-header';
        header.innerHTML = `<span>📖 ${intoData.title || 'INTRO: INTO BLACKOUT'}</span><span class="cue-tag">PRE-SHOW</span>`;
        intoCard.appendChild(header);

        if (intoData.note) {
          const note = document.createElement('div');
          note.className = 'story-note';
          note.textContent = intoData.note;
          intoCard.appendChild(note);
        }

        const p = document.createElement('div');
        p.className = 'script-text';
        p.textContent = intoData.script || '';
        intoCard.appendChild(p);

        scriptContainer.appendChild(intoCard);
      }

      manifest.scenes.forEach((s) => {
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.id = `card_${s.index}`;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cue-btn';
        btn.id = `btn_${s.index}`;
        btn.innerHTML = `<span>${s.title}</span><span class="cue-tag">${s.exists ? 'CUE ▶' : 'MISSING FILE'}</span>`;
        btn.addEventListener('click', () => cueScene(s.index));

        const p = document.createElement('div');
        p.className = 'script-text';
        p.textContent = s.script;

        card.appendChild(btn);
        card.appendChild(p);
        scriptContainer.appendChild(card);
      });

      if (manifest.postBlackout) {
        const postData = typeof manifest.postBlackout === 'object' ? manifest.postBlackout : { scriptPart1: manifest.postBlackout };
        const postCard = document.createElement('div');
        postCard.className = 'story-card';
        postCard.id = 'card_post_blackout';

        const header = document.createElement('div');
        header.className = 'story-header';
        header.innerHTML = `<span>📖 ${postData.title || 'OUTRO: POST BLACKOUT'}</span><span class="cue-tag">FINALE</span>`;
        postCard.appendChild(header);

        if (postData.note) {
          const note = document.createElement('div');
          note.className = 'story-note';
          note.textContent = postData.note;
          postCard.appendChild(note);
        }

        const p1 = document.createElement('div');
        p1.className = 'script-text';
        p1.textContent = postData.scriptPart1 || postData.script || '';
        postCard.appendChild(p1);

        if (postData.scriptPart2) {
          const cueBtn = document.createElement('button');
          cueBtn.type = 'button';
          cueBtn.className = 'inline-cue-btn';
          cueBtn.textContent = 'FADE HOME IN 🏠';
          cueBtn.addEventListener('click', () => sendCmd({ type: 'fade_home_in' }));
          postCard.appendChild(cueBtn);

          const p2 = document.createElement('div');
          p2.className = 'script-text';
          p2.style.fontWeight = '700';
          p2.style.color = '#f59e0b';
          p2.textContent = postData.scriptPart2;
          postCard.appendChild(p2);
        }

        scriptContainer.appendChild(postCard);
      }

      if (state) renderUI();
    }

    function syncPhoneAudio(s) {
      if (!ambientUrl || !s) return;
      const isPhoneOut = (s.audioOutput === 'phone' || !s.audioOutput);
      const shouldPlay = isPhoneOut && s.audioPlaying && !s.blackout && (s.stageMode === 'scene' || s.stageMode === 'scene_transition');
      if (shouldPlay) {
        if (ambientEl.paused) ambientEl.play().catch(() => {});
        targetAudioVol = s.audioVolume ?? 0.2;
      } else {
        targetAudioVol = 0;
      }
    }

    function renderUI() {
      if (!state) return;
      syncPhoneAudio(state);

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        boardBadge.className = 'badge err';
        boardBadge.textContent = 'RECONNECTING...';
      } else if (!state.boardConnected) {
        boardBadge.className = 'badge err';
        boardBadge.textContent = 'NO SMARTBOARD';
      } else if (state.preloadPercent < 100) {
        boardBadge.className = 'badge warn';
        boardBadge.textContent = `LOADING ${state.preloadPercent}%`;
      } else if (!state.boardArmed) {
        boardBadge.className = 'badge warn';
        boardBadge.textContent = 'TAP BOARD TO ARM';
      } else {
        boardBadge.className = 'badge ok';
        boardBadge.textContent = state.preloadStatus === 'fallback' ? 'ARMED (STREAM)' : 'STAGE ARMED';
      }

      const mode = state.stageMode || (state.blackout ? 'blackout' : state.activeScene >= 0 ? 'scene' : 'standby_loop');

      if (state.boardWarning) {
        liveStatus.textContent = `Warning: ${state.boardWarning}`;
      } else if (mode === 'standby_loop') {
        liveStatus.textContent = 'Now Showing: STANDBY LOOP';
      } else if (mode === 'transitioning_black') {
        liveStatus.textContent = 'Stage: Fading Out to Black...';
      } else if (mode === 'transitioning_home') {
        liveStatus.textContent = 'Stage: Fading Home In...';
      } else if (mode === 'scene_transition') {
        liveStatus.textContent = `Transitioning to Scene ${(state.targetScene || 0) + 1}...`;
      } else if (mode === 'blackout' || state.blackout) {
        if (state.activeScene === (manifest ? manifest.scenes.length - 1 : 9)) {
          liveStatus.textContent = 'Show Ended: BLACKOUT';
        } else {
          liveStatus.textContent = 'Now Showing: BLACKOUT';
        }
      } else if (manifest && manifest.scenes[state.activeScene]) {
        liveStatus.textContent = `Live: ${manifest.scenes[state.activeScene].title}`;
      }

      // Configure blackoutBtn
      if (mode === 'standby_loop') {
        blackoutBtn.className = 'ctrl-btn active-blackout';
        blackoutBtn.textContent = 'SCREEN GO BLACK';
      } else if (mode === 'transitioning_black') {
        blackoutBtn.className = 'ctrl-btn active-blackout';
        blackoutBtn.textContent = 'FADING OUT...';
      } else if (mode === 'blackout' || state.blackout) {
        blackoutBtn.className = 'ctrl-btn active-blackout';
        blackoutBtn.textContent = 'BLACKOUT ON';
      } else {
        blackoutBtn.className = 'ctrl-btn';
        blackoutBtn.textContent = 'FADE TO BLACK';
      }

      // Configure audioOutputBtn and audioBtn
      const isScreenOut = state.audioOutput === 'screen';
      if (isScreenOut) {
        audioOutputBtn.className = 'badge audio-out-btn screen';
        audioOutputBtn.textContent = 'AUDIO: 📺 SCREEN';
        audioBtn.className = state.audioPlaying && !state.blackout ? 'ctrl-btn active-audio' : 'ctrl-btn';
        audioBtn.textContent = state.audioPlaying && !state.blackout ? '📺 TV LIVE' : '📺 TV MUTED';
      } else {
        audioOutputBtn.className = 'badge audio-out-btn phone';
        audioOutputBtn.textContent = 'AUDIO: 📱 PHONE';
        audioBtn.className = state.audioPlaying && !state.blackout ? 'ctrl-btn active-audio' : 'ctrl-btn';
        audioBtn.textContent = state.audioPlaying && !state.blackout ? '📱 PHONE LIVE' : '📱 PHONE MUTED';
      }

      // Configure fadeHomeBtn & nextBtn
      const isShowEnded = state.activeScene === (manifest ? manifest.scenes.length - 1 : 9);
      if (mode === 'standby_loop') {
        fadeHomeBtn.style.display = 'none';
        footerBar.classList.remove('has-home');
        nextBtn.className = 'ctrl-btn next-btn';
        nextBtn.textContent = 'START SCENE 1 ▶';
      } else if (mode === 'transitioning_black') {
        fadeHomeBtn.style.display = 'none';
        footerBar.classList.remove('has-home');
        nextBtn.className = 'ctrl-btn';
        nextBtn.textContent = 'FADING TO BLACK...';
      } else if (mode === 'transitioning_home') {
        fadeHomeBtn.style.display = 'none';
        footerBar.classList.remove('has-home');
        nextBtn.className = 'ctrl-btn';
        nextBtn.textContent = 'FADING HOME...';
      } else if (mode === 'scene_transition') {
        fadeHomeBtn.style.display = 'none';
        footerBar.classList.remove('has-home');
        const targetNum = (state.targetScene || 0) + 1;
        nextBtn.className = 'ctrl-btn';
        nextBtn.textContent = `TRANSITIONING TO SCENE ${targetNum}...`;
      } else if (mode === 'blackout' && state.activeScene < 0) {
        fadeHomeBtn.style.display = 'block';
        footerBar.classList.add('has-home');
        nextBtn.className = 'ctrl-btn next-btn';
        nextBtn.textContent = 'START SCENE 1 ▶';
      } else if (isShowEnded) {
        fadeHomeBtn.style.display = 'block';
        footerBar.classList.add('has-home');
        if (state.blackout || mode === 'blackout') {
          nextBtn.className = 'ctrl-btn home-btn';
          nextBtn.textContent = 'FADE HOME IN 🏠';
        } else {
          nextBtn.className = 'ctrl-btn active-blackout';
          nextBtn.textContent = 'FINISH & BLACKOUT';
        }
      } else {
        fadeHomeBtn.style.display = 'none';
        footerBar.classList.remove('has-home');
        const nextSceneNum = state.activeScene + 2;
        nextBtn.className = 'ctrl-btn next-btn';
        nextBtn.textContent = `NEXT: SCENE ${nextSceneNum} ▶`;
      }

      // Update scene cards
      if (manifest) {
        manifest.scenes.forEach((s) => {
          const card = document.getElementById(`card_${s.index}`);
          const btn = document.getElementById(`btn_${s.index}`);
          if (!card || !btn) return;

          const isLive = (!state.blackout && state.activeScene === s.index && mode !== 'scene_transition');
          const isTransitionTarget = (mode === 'scene_transition' && state.targetScene === s.index);

          card.classList.toggle('active', isLive || isTransitionTarget);
          const tagSpan = btn.querySelector('.cue-tag');
          if (tagSpan) {
            if (!s.exists) tagSpan.textContent = 'MISSING!';
            else if (isLive) tagSpan.textContent = 'LIVE ON SCREEN';
            else if (isTransitionTarget) tagSpan.textContent = 'TRANSITIONING...';
            else tagSpan.textContent = 'CUE ▶';
          }
        });
      }

      const intoCard = document.getElementById('card_into_blackout');
      if (intoCard) {
        const isIntoActive = (mode === 'blackout' && state.activeScene < 0) || (mode === 'transitioning_black');
        intoCard.classList.toggle('active', isIntoActive);
      }

      const postCard = document.getElementById('card_post_blackout');
      if (postCard) {
        const isPostActive = isShowEnded && (state.blackout || mode === 'blackout' || mode === 'transitioning_home');
        postCard.classList.toggle('active', isPostActive);
      }
    }

    let reconnectTimer = null;
    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectWS();
      }, 1000);
    }

    function connectWS() {
      if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.close(); } catch {}
      }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'hello', role: 'remote' }));
        renderUI();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') {
            state = msg.state;
            renderUI();
          }
        } catch {}
      };

      ws.onclose = () => {
        renderUI();
        scheduleReconnect();
      };
      ws.onerror = () => {
        try { ws.close(); } catch {}
        scheduleReconnect();
      };
    }

    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 5000);

    loadManifest();
    connectWS();
  </script>
</body>
</html>
